<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NBN Sinhgad Technical Institute Campus</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/db-service.js"></script>
  <script src="js/auth.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.25rem 1rem; background: var(--bg-body);">

  <div class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-xl);">
    <div class="card-header" style="text-align: center; display: block; padding: 1.75rem 1.25rem 1rem;">
      <div style="width: 48px; height: 48px; background: linear-gradient(135deg, var(--primary), #818cf8); color: #fff; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 0.75rem;">🎓</div>
      <h2 style="font-size: 1.25rem; margin-bottom: 0.25rem; line-height: 1.25;">NBN Sinhgad</h2>
      <div style="font-size: 0.8rem; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.35rem;">Technical Institute Campus</div>
      <p style="font-size: 0.85rem; margin: 0; color: var(--text-muted);">Sign in to SAMS Academic Portal</p>
    </div>

    <div class="card-body" style="padding: 1.75rem;">
      <form id="login-form">
        <div class="form-group">
          <label class="form-label required" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@college.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label required" for="login-password" style="margin-bottom: 0;">Password</label>
            <button type="button" id="btn-toggle-pwd" style="background: none; border: none; font-size: 0.75rem; color: var(--primary); cursor: pointer;">Show</button>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div id="login-error-msg" style="display: none; padding: 0.75rem; border-radius: var(--radius-md); background: var(--danger-light); color: var(--danger-text); font-size: 0.85rem; margin-bottom: 1.25rem; font-weight: 500;"></div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
          Sign In to Portal
        </button>
      </form>

      <!-- Demo Account Quick Fill Buttons -->
      <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px dashed var(--border-color);">
        <div style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 0.75rem; text-align: center;">One-Click Demo Accounts</div>
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" onclick="fillDemo('admin')" class="btn btn-sm btn-secondary" style="flex: 1;">Admin Demo</button>
          <button type="button" onclick="fillDemo('student')" class="btn btn-sm btn-secondary" style="flex: 1;">Student Demo</button>
        </div>
      </div>
    </div>

    <div class="card-footer" style="display: flex; flex-direction: column; gap: 0.5rem; text-align: center; font-size: 0.88rem;">
      <div>Don't have an account? <a href="signup.html" style="font-weight: 700; color: var(--primary);">Sign Up as Student or Teacher →</a></div>
      <a href="index.html" style="font-size: 0.8rem; color: var(--text-muted);">← Return to Homepage</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect
      auth.protectRoute();

      const pwdInput = document.getElementById('login-password');
      const toggleBtn = document.getElementById('btn-toggle-pwd');
      toggleBtn.addEventListener('click', () => {
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
          toggleBtn.textContent = 'Hide';
        } else {
          pwdInput.type = 'password';
          toggleBtn.textContent = 'Show';
        }
      });

      const form = document.getElementById('login-form');
      const errorMsg = document.getElementById('login-error-msg');
      const submitBtn = document.getElementById('btn-login-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<div class="spinner"></div> Signing in...';

        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        try {
          const user = await auth.login(email, password);
          showToast(`Welcome back, ${user.name}!`, 'success');
          setTimeout(() => {
            if (user.role === 'admin') {
              window.location.href = 'admin-dashboard.html';
            } else {
              window.location.href = 'student-dashboard.html';
            }
          }, 600);
        } catch (err) {
          errorMsg.textContent = err.message || "Failed to sign in. Please check credentials.";
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to Portal';
        }
      });
    });

    function fillDemo(role) {
      const emailInput = document.getElementById('login-email');
      const pwdInput = document.getElementById('login-password');

      if (role === 'admin') {
        emailInput.value = 'admin@college.edu';
        pwdInput.value = 'admin123';
      } else {
        emailInput.value = 'aarav.sharma@college.edu';
        pwdInput.value = 'student123';
      }
    }
  </script>
</body>
</html>
